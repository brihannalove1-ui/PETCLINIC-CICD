
name: CI/CD Pipeline - PetClinic

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-sonar:
    name: Build, Test and SonarCloud
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Verify compiled classes
        shell: bash
        run: |
          if [ ! -d target/classes ]; then
            echo "ERROR: target/classes was not generated."
            exit 1
          fi
          echo "Compiled classes found."

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonarcloud
          restore-keys: |
            ${{ runner.os }}-sonarcloud

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
